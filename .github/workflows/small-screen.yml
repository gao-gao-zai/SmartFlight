name: 410x502 screen checks

on:
  pull_request:
    paths:
      - '.github/workflows/small-screen.yml'
      - 'scripts/run_small_screen_tests.sh'
      - 'app/src/androidTest/java/com/gaozay/smartflight/screen/**'
      - 'app/src/main/java/com/gaozay/smartflight/ui/**'

permissions:
  contents: read

jobs:
  screen-410x502:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build emulator APKs
        run: bash gradlew assembleDebug assembleDebugAndroidTest -PemulatorAbi=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
      - name: Test actual 410x502 display at two densities in Chinese and English
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_small_screen_tests.sh
      - name: Upload screen reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartflight-screen-410x502
          path: app/build/emulator-artifacts/screen-410x502
          retention-days: 14
