name: Promotional video emulator capture
on:
  push:
    branches: ['video/capture-410x502']
    paths: ['.github/workflows/promo-capture.yml', 'scripts/record_promo.sh', 'scripts/activity-fixture/**', 'app/src/androidTest/java/com/gaozay/smartflight/promo/**']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build recording APKs
        run: bash gradlew assembleDebug assembleDebugAndroidTest -PemulatorAbi=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record genuine UI and automation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/record_promo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartflight-promo-recordings
          path: |
            app/build/emulator-artifacts/promo
            !app/build/emulator-artifacts/promo/*.apk
            !app/build/emulator-artifacts/promo/shizuku-starter
          retention-days: 14
